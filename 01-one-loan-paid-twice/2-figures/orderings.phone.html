<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twenty orderings, eighteen pay twice</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {

  --ok: #25774A;
  --ok-soft: #DCEFE2;
  --selection: var(--input-soft);
  --code-bg: var(--paper-2);
  --code-text: var(--ink);
  --code-keyword: #83339A;
  --code-string: #2E6B1E;
  --code-number: #8C5300;
  --code-function: #0B6470;
  --code-call: #264F8C;
  --code-builtin: #0B6470;
  --code-comment: #61646A;

  --font-body: "Literata", Georgia, serif;
  --font-title: "Rubik", system-ui, sans-serif;
  --font-ui: "Rubik", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-math: "Literata", "STIX Two Math", serif;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-bold: 600;
  --weight-title: 600;

  --text-fig: 12.5px;
  --text-fig-tick: 13px;
  --text-fig-name: 15px;
  --text-fig-note: 17px;
  --text-fig-math: 18px;
  --text-micro: 13px;
  --text-small: 14.5px;
  --text-caption: 15.5px;
  --text-ui: 16px;
  --text-body: 18px;
  --text-h3: 19px;
  --text-result: 19px;
  --text-lead: clamp(20px, 2.3vw, 23px);
  --text-h2: clamp(25px, 2.9vw, 29px);
  --text-h1: clamp(36px, 5.4vw, 50px);
  --text-table: 14px;
  --text-code: 14.5px;
  --text-math: 1.02em;
  --text-math-display: 1.15em;

  --leading-body: 1.62;
  --leading-ui: 1.4;
  --leading-caption: 1.5;
  --leading-code: 1.5;
  --leading-heading: 1.18;

  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-18: 72px;
  --space-20: 80px;

  --space-gutter: var(--space-4);
  --space-block: var(--space-5);
  --space-section: var(--space-18);
  --space-heading-after: var(--space-3);
  --space-header-gap: var(--space-4);
  --space-crumbs-top: var(--space-8);

  --space-header-after: var(--space-14);
  --space-page-bottom: var(--space-20);
  --space-list: var(--space-2);
  --space-lab: var(--space-5);
  --space-control: var(--space-3);

  --space-cell-y: var(--space-2);

  --line-hair: 1px;
  --line-strong: 1.5px;
  --line-mark: 3px;
  --focus-ring: 2px;
  --motion-step: 650ms;

  --measure: var(--layout-measure);
  --column: var(--layout-breakout);
  --block-gap: var(--space-block);
  --section-gap: var(--space-section);
}

@media (max-width: 520px) {

    --text-body: 17px;
    --text-table: 12.5px;
    --text-math-display: 0.82em;
    --space-cell-x: var(--space-3);

    --accent: #F0A73A; --accent-ink: #F4BD68; --accent-soft: #3B2C12; --input: #79A6E6; --input-soft: #233A5C; --ok: #5FC28E; --ok-soft: #15301F;
    --code-keyword: #D3A2F2; --code-string: #A3D58F; --code-number: #F4BD68; --code-function: #7CCAD3; --code-call: #A9C4F0; --code-builtin: #7CCAD3; --code-comment: #9C9C97;

  }
}

  --paper: #17181B; --paper-2: #222429; --ink: #ECEAE5; --ink-soft: #A4A39E; --rule: #35373C;
  --accent: #F0A73A; --accent-ink: #F4BD68; --accent-soft: #3B2C12; --input: #79A6E6; --input-soft: #233A5C; --ok: #5FC28E; --ok-soft: #15301F;
    --code-keyword: #D3A2F2; --code-string: #A3D58F; --code-number: #F4BD68; --code-function: #7CCAD3; --code-call: #A9C4F0; --code-builtin: #7CCAD3; --code-comment: #9C9C97;

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); line-height: var(--leading-body); font-optical-sizing: auto; text-rendering: optimizeLegibility; font-feature-settings: "kern", "liga"; }
::selection { background: var(--selection); color: var(--ink); }
:focus-visible { outline: var(--focus-ring) solid var(--input); outline-offset: var(--space-1); border-radius: 2px; }

.wrap { max-width: calc(var(--measure) + 2 * var(--space-gutter)); margin: 0 auto; padding: 0 max(var(--space-gutter), env(safe-area-inset-right, 0px)) var(--space-page-bottom) max(var(--space-gutter), env(safe-area-inset-left, 0px)); }

.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); padding-top: var(--space-crumbs-top); font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-ui); color: var(--ink-soft); }
.crumbs a { color: var(--ink-soft); }
header { display: grid; gap: var(--space-header-gap); padding-top: var(--space-header-top); }
h1 { font-size: var(--text-h1); line-height: var(--leading-title); letter-spacing: var(--tracking-title); }
.question { font-size: var(--text-lead); line-height: var(--leading-ui); color: var(--ink-soft); }

section { margin-top: var(--space-section); display: grid; gap: var(--space-block); }

figcaption { font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-soft); max-width: var(--measure); }
.diagram { overflow-x: auto; }
section > figure, section > .lab, section > .k-wide { width: min(var(--column), calc(100vw - 2 * var(--space-gutter))); margin-left: calc((100% - min(var(--column), calc(100vw - 2 * var(--space-gutter)))) / 2); }

.lab { display: grid; gap: var(--space-4); border: var(--line-hair) solid var(--rule); border-radius: var(--radius); padding: var(--space-lab); background: var(--paper); font-family: var(--font-ui); font-size: var(--text-ui); line-height: var(--leading-ui); }
.lab p { max-width: none; }

.key { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-5); font-size: var(--text-caption); color: var(--ink-soft); }

.table { overflow-x: auto; max-width: 100%; }

.myth { border-left: var(--line-mark) solid var(--accent); padding-left: var(--space-4); display: grid; gap: var(--space-2); }
.myth b { color: var(--accent-ink); }

footer { margin-top: var(--space-section); border-top: var(--line-hair) solid var(--rule); padding-top: var(--space-3); max-width: var(--measure); font-family: var(--font-ui); font-size: var(--text-small); line-height: var(--leading-caption); color: var(--ink-soft); display: grid; gap: var(--space-1); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

.toc { margin-top: var(--space-header-after); font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-ui); }
.toc + section { margin-top: var(--space-section); }
.toc summary { cursor: pointer; width: fit-content; font-weight: var(--weight-bold); color: var(--ink); }
.toc ol { margin: var(--space-3) 0 0; padding-left: 1.6em; columns: 2 16em; column-gap: var(--space-8); }
.toc li { break-inside: avoid; padding-block: calc(var(--space-1) / 2); color: var(--ink-soft); }

.toc a:hover { text-decoration: underline; }
html { scroll-behavior: smooth; scroll-padding-top: var(--space-6); }
figcaption { text-wrap: pretty; }
section > figure > figcaption { width: 100%; max-width: var(--measure); margin-inline: auto; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

.k-fig { display: block; width: 100%; height: auto; --k-step: var(--motion-step); }
.k-fig.k-narrow { display: none; max-width: 440px; margin: 0 auto; }

.k-fig .k-bg { fill: var(--paper); }

.k-fig .k-stem-input-dot { fill: var(--input); }
.k-fig .k-hollow { fill: var(--paper); stroke-width: 1.5; }
.k-fig .k-stem-dot.k-hollow { stroke: var(--ink); }
.k-fig .k-bar { fill: var(--ink); }
.k-fig .k-bar-soft { fill: var(--ink-soft); }
.k-fig .k-ring-missing { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }

.k-fig .k-arrow { stroke: var(--ink-soft); stroke-width: 1.5; fill: none; }
.k-fig .k-arrow.k-accent { stroke: var(--accent); }

.k-fig .k-head { fill: var(--ink-soft); }
.k-fig .k-head-accent { fill: var(--accent); }

.k-fig .k-vec { stroke: var(--ink); stroke-width: 2; }

.k-fig .k-stop { fill: var(--ink-soft); }

.k-fig .k-mask { fill: var(--paper); }

.k-fig .k-box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }

.k-fig .k-name-ok { font-family: var(--font-ui); font-weight: var(--weight-bold); font-size: var(--text-fig-name); fill: var(--ok); }
.k-fig .k-num-ok { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ok); font-weight: var(--weight-medium); }
.k-fig .k-mark-ok { stroke: var(--input); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.k-fig text { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink-soft); }
.k-fig .k-label { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink-soft); }
.k-fig .k-tick { font-family: var(--font-mono); font-size: var(--text-fig-tick); fill: var(--ink-soft); }
.k-fig .k-num { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink); font-variant-numeric: tabular-nums; }
.k-fig .k-num-accent { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--accent-ink); font-weight: var(--weight-medium); }
.k-fig .k-num-input { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--input); font-weight: var(--weight-medium); }
.k-fig .k-name { font-family: var(--font-ui); font-weight: var(--weight-bold); font-size: var(--text-fig-name); fill: var(--ink); }

@keyframes k-in { from { opacity: 0; } }

}

body { padding: 40px 16px; }
