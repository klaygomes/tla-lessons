<style>
.lab > * { min-width: 0; }
.lab .k-predict { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--paper-2); }
.k-predict .k-q { font-weight: var(--weight-bold); }
.k-predict button { min-width: calc(var(--space-14) + var(--space-1)); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.k-predict button.k-right { background: var(--input-soft); border-color: var(--input); opacity: 1; }
.k-predict button.k-missed { border-color: var(--accent); color: var(--accent-ink); opacity: 1; }
.k-predict .k-feedback { min-height: 1.4em; }
.k-predict .k-feedback.k-bad { color: var(--accent-ink); }
.k-predict .k-feedback:focus { outline: none; }
.lab .k-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.lab .k-lane { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3); border: var(--line-hair) solid var(--rule); border-radius: var(--radius-sm); }
.lab .k-lane-name { font-weight: var(--weight-bold); }
.lab .k-lane .row { min-height: calc(var(--space-10) + var(--space-1)); }
.lab button.k-step { border-color: var(--input); color: var(--input); font-family: var(--font-mono); font-size: var(--text-ui); min-height: calc(var(--space-10) + var(--space-1)); }
.lab button.k-step:hover { background: var(--input-soft); }
.lab .k-lane-note { color: var(--ink-soft); font-size: var(--text-caption); }
.lab .k-now { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--space-5); align-items: start; }
.lab .k-panel { display: grid; gap: var(--space-2); min-width: 0; }
.lab .k-cap { font-size: var(--text-small); line-height: var(--leading-caption); color: var(--ink-soft); }
.lab .k-head-title { font-weight: var(--weight-bold); font-size: var(--text-ui); }
.k-seq svg { display: block; max-width: 100%; height: auto; }
.k-seq text { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink-soft); }
.k-seq text.k-bad { fill: var(--accent-ink); font-weight: var(--weight-medium); }
.k-seq .k-life { stroke: var(--rule); }
.k-seq .k-actor rect { fill: var(--paper-2); stroke: var(--ink-soft); stroke-width: 0.8; }
.k-seq .k-actor text { font-family: var(--font-ui); fill: var(--ink); }
.k-seq .k-msg { stroke: var(--ink-soft); stroke-width: 1.2; }
.k-seq .k-msg.k-bad { stroke: var(--accent); stroke-width: 1.6; }
.k-seq .k-head { fill: var(--ink-soft); }
.k-seq .k-head.k-head-bad { fill: var(--accent); }
.k-seq .k-bar { fill: var(--paper-2); stroke: var(--ink-soft); stroke-width: 0.8; }
.k-seq .k-mask { fill: var(--paper); }
.lab .k-strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); }
.lab .k-strip li { display: grid; padding: var(--space-1) var(--space-2); border: var(--line-hair) solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-ui); font-variant-numeric: tabular-nums; }
.lab .k-strip .k-card-step { font-family: var(--font-ui); font-weight: var(--weight-medium); color: var(--ink); }
.lab .k-strip li > span:not(.k-card-step) { color: var(--ink-soft); }
.lab .k-strip li.k-bad { border-color: var(--accent); background: var(--accent-soft); }
.lab .k-strip li.k-bad .k-card-t { color: var(--accent-ink); font-weight: var(--weight-medium); }
.lab .k-tally { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.lab .k-tally .k-bad-n { color: var(--accent-ink); font-weight: var(--weight-medium); }
.lab .readout .result { font-size: var(--text-ui); overflow-wrap: anywhere; }
.lab .readout .result .ok { color: var(--ok); font-weight: var(--weight-medium); }
.lab button.k-primary, .act2 button.k-primary { background: var(--input); border-color: var(--input); color: var(--paper); font-weight: var(--weight-bold); }
.lab button.k-primary:hover, .act2 button.k-primary:hover { background: var(--ink); border-color: var(--ink); }
.lab button.k-primary:disabled:hover { background: var(--input); border-color: var(--input); }
.act2 { display: grid; }
.act2 button.k-primary { justify-self: start; padding: var(--space-4) var(--space-6); font-size: var(--text-h3); line-height: var(--leading-heading); text-align: left; }
.lab .k-checker { display: grid; gap: var(--space-3); }
.lab .k-graph-note { font-size: var(--text-ui); }
.lab .k-trace { display: grid; gap: var(--space-3); }
.lab .k-changes { display: grid; gap: var(--space-3); }
.lab .k-toggles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.lab .k-toggles button { text-align: left; line-height: var(--leading-ui); padding: var(--space-3); }
.lab .k-workers { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.lab .k-workers button { min-width: calc(var(--space-10) + var(--space-1)); min-height: calc(var(--space-10) + var(--space-1)); font-family: var(--font-mono); }
.lab .k-group-label { font-weight: var(--weight-bold); margin-right: var(--space-2); }
.lab pre.k-spec { white-space: pre; }
.lab pre.k-spec .k-line { display: block; }
.lab pre.k-spec .k-line.k-changed { background: var(--input-soft); margin-inline: calc(-1 * var(--space-2)); padding-inline: var(--space-2); border-radius: var(--radius-sm); }
.lab .k-win { display: grid; gap: var(--space-2); border: var(--line-strong) solid var(--ok); border-radius: var(--radius); background: var(--ok-soft); padding: var(--space-4); }
.lab .k-win:focus { outline: none; }
.lab .k-win p { margin: 0; }
.lab .k-win .k-win-head { font-family: var(--font-title); font-weight: var(--weight-bold); font-size: var(--text-h3); line-height: var(--leading-heading); }
.lab .k-win b { color: var(--ok); font-family: var(--font-mono); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.lab .k-win canvas { width: 100%; display: block; }
.lab .jump { font-size: var(--text-caption); }
.lab .story { font-weight: var(--weight-medium); }
@media (max-width: 520px) {
  .lab .k-now { grid-template-columns: minmax(0, 1fr); }
  .lab .k-lanes { gap: var(--space-2); }
  .lab .k-lane { padding: var(--space-2); }
  .lab .k-toggles { grid-template-columns: minmax(0, 1fr); }
  .act2 button.k-primary { font-size: var(--text-ui); padding: var(--space-3) var(--space-4); }
}
</style>
<template id="desk-lab">
  <div class="task" data-k="task"><p class="story">The bakery wants its €50,000 once. Change the desk, run the checker, and ship only when no reachable state pays twice, with at least two workers and still with three.</p></div>
  <div class="k-predict" data-k="ask"></div>
  <div class="k-changes" data-k="changes">
    <div class="k-toggles" role="group" aria-label="Changes to the desk">
      <button type="button" data-toggle="recheck" aria-pressed="false">Add Recheck before Send</button>
      <button type="button" data-toggle="delay" aria-pressed="false">Add a random delay</button>
      <button type="button" data-toggle="claim" aria-pressed="false">Replace Check with atomic Claim</button>
    </div>
    <div class="k-workers" role="group" aria-label="Workers">
      <span class="k-group-label">Workers</span>
      <button type="button" data-workers="1" aria-pressed="false">1</button>
      <button type="button" data-workers="2" aria-pressed="true">2</button>
      <button type="button" data-workers="3" aria-pressed="false">3</button>
    </div>
  </div>
  <p class="note" data-k="spec-note">The desk’s actions right now; tinted lines are your changes. Shorthand: <code>pc′[w] = "sent"</code> stands for <code>pc′ = [pc EXCEPT ![w] = "sent"]</code>, and a variable a line does not mention stays unchanged.</p>
  <pre class="code k-spec" data-k="spec"></pre>
  <div class="k-lanes" data-k="lanes" role="group" aria-label="Scheduler: the steps each worker may take now">
    <div class="k-lane"><span class="k-lane-name">Worker A</span><div class="row" data-lane="0"></div></div>
    <div class="k-lane"><span class="k-lane-name">Worker B</span><div class="row" data-lane="1"></div></div>
  </div>
  <div class="k-now" data-k="now">
    <div class="k-panel">
      <span class="k-head-title">The state</span>
      <canvas data-k="desk" class="stage" role="img"></canvas>
      <p class="k-cap">Where each worker is in its code (its pc), the loan’s status, and the transfers the bank has made to the bakery.</p>
    </div>
    <div class="k-panel">
      <span class="k-head-title">The behavior so far</span>
      <div class="k-seq" data-k="seq"></div>
      <p class="k-cap">Time runs down. The bar on a worker’s line runs from its Check to its last step.</p>
    </div>
  </div>
  <ol class="k-strip" data-k="strip" aria-label="The behavior so far, state by state"></ol>
  <p class="k-tally" data-k="tally"></p>
  <div class="readout" aria-live="polite">
    <div class="result" data-k="result"></div>
    <p data-k="why"></p>
  </div>
  <div class="row">
    <button type="button" class="k-primary" data-k="run">Run the checker</button>
    <button type="button" data-k="more" hidden>Explore the rest</button>
    <button type="button" data-k="reset">Reset</button>
  </div>
  <div class="k-checker" data-k="checker" hidden>
    <p class="k-graph-note" data-k="graph-note" aria-live="polite"></p>
    <canvas data-k="graph" class="stage" role="img"></canvas>
    <p class="k-cap" data-k="graph-key"></p>
    <div class="k-trace" data-k="trace" hidden>
      <p class="k-head-title" data-k="trace-title"></p>
      <div class="k-seq" data-k="trace-seq"></div>
      <ol class="k-strip" data-k="trace-strip" aria-label="The counterexample, state by state"></ol>
    </div>
  </div>
  <div class="k-win" data-k="win" tabindex="-1" hidden>
    <p class="k-win-head">Fixed: the bakery gets one transfer</p>
    <p>No reachable state breaks NoDoublePayout: <b data-k="win-two">12</b> states with 2 workers, <b data-k="win-three">32</b> with 3. Claim makes “see approved” and “take the loan” one step.</p>
    <canvas data-k="bakery" role="img" aria-label="The bank sends one transfer of €50,000 to the bakery."></canvas>
    <p class="k-cap">On Monday the bakery received €100,000. With the claim, every ordering of the workers sends €50,000, once.</p>
  </div>
  <p class="jump" data-k="jump"><a href="#fix-the-bug">Ready to fix it? Jump to the challenge.</a></p>
</template>
<div class="lab" id="lab"></div>
