<style>
.lab > * { min-width: 0; }
.lab .k-ask { padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--paper-2); }
.lab .k-ask button { font-variant-numeric: tabular-nums; }
.lab .k-ask button:not(.quiet) { min-width: calc(var(--space-10) + var(--space-1)); }
.lab .k-deploy { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.lab .k-deploy .k-cap { flex: 1 1 16em; }
.lab .k-toggles button::before, .lab .k-deploy button::before { content: "○\00a0"; color: var(--ink-soft); }
.lab .k-toggles button[aria-pressed="true"]::before, .lab .k-deploy button[aria-pressed="true"]::before { content: "●\00a0"; color: var(--input); }
.lab .k-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.lab .k-lane { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3); border: var(--line-hair) solid var(--rule); border-radius: var(--radius-sm); }
.lab .k-lane-name { font-weight: var(--weight-bold); }
.lab .k-lane .row { min-height: calc(var(--space-10) + var(--space-1)); }
.lab button.k-step { border-color: var(--input); color: var(--input); font-family: var(--font-mono); font-size: var(--text-ui); min-height: calc(var(--space-10) + var(--space-1)); }
.lab button.k-step:hover { background: var(--input-soft); }
.lab button.k-step.k-crash { border-style: dashed; }
.lab .k-lane-note { color: var(--ink-soft); font-size: var(--text-small); }
.lab .k-forever { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.lab .k-lamps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.lab .k-lamp { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border: var(--line-hair) solid var(--rule); border-radius: var(--radius-sm); }
.lab .k-lamp-mark { grid-row: span 2; display: grid; place-items: center; width: var(--space-8); height: var(--space-8); border-radius: 50%; border: var(--line-strong) solid var(--ink-soft); font-family: var(--font-mono); font-weight: var(--weight-bold); color: var(--ink-soft); }
.lab .k-lamp-name { font-weight: var(--weight-bold); }
.lab .k-lamp-word { font-size: var(--text-small); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.lab .k-lamp[data-state="holds"] .k-lamp-mark { border-color: var(--ink); color: var(--ink); }
.lab .k-lamp[data-state="fails"] { border-color: var(--accent); }
.lab .k-lamp[data-state="fails"] .k-lamp-mark { border-radius: var(--radius-sm); border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.lab .k-lamp[data-state="fails"] .k-lamp-word { color: var(--accent-ink); }
.lab .k-lamp[data-state="ok"] { border-color: var(--ok); background: var(--ok-soft); }
.lab .k-lamp[data-state="ok"] .k-lamp-mark { border-color: var(--ok); background: var(--ok); color: var(--paper); }
.lab .k-lamp[data-state="ok"] .k-lamp-word { color: var(--ink); }
.lab .k-panel { display: grid; gap: var(--space-2); min-width: 0; }
.lab .k-head-title { font-weight: var(--weight-bold); font-size: var(--text-ui); }
.lab .k-cap { font-size: var(--text-small); line-height: var(--leading-caption); color: var(--ink-soft); }
.lab canvas.k-strip { width: 100%; display: block; }
.lab .k-tally { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-small); }
.lab .k-tally .k-bad-n { color: var(--accent-ink); font-weight: var(--weight-medium); }
.lab .readout .result { font-size: var(--text-ui); overflow-wrap: anywhere; }
.lab .readout .k-count { font-weight: var(--weight-medium); }
.lab button.k-primary, .act2 button.k-primary { background: var(--input); border-color: var(--input); color: var(--paper); font-weight: var(--weight-bold); }
.lab button.k-primary:hover, .act2 button.k-primary:hover { background: var(--ink); border-color: var(--ink); }
.lab button.k-primary:disabled:hover { background: var(--input); border-color: var(--input); }
.act2 { display: grid; }
.act2 button.k-primary { justify-self: start; padding: var(--space-4) var(--space-6); font-size: var(--text-h3); line-height: var(--leading-ui); text-align: left; }
.lab .k-changes { display: grid; gap: var(--space-3); }
.lab .k-toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.lab .k-toggles button { text-align: left; line-height: var(--leading-ui); padding: var(--space-3); min-height: calc(var(--space-10) + var(--space-1)); }
.lab .k-workers { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.lab .k-workers button { min-width: calc(var(--space-10) + var(--space-1)); min-height: calc(var(--space-10) + var(--space-1)); font-family: var(--font-mono); }
.lab .k-group-label { font-weight: var(--weight-bold); margin-right: var(--space-2); }
.lab pre.k-spec { white-space: pre; font-size: var(--text-micro); }
.lab pre.k-spec .k-line { display: block; }
.lab pre.k-spec .k-line.k-changed { background: var(--input-soft); margin-inline: calc(-1 * var(--space-2)); padding-inline: var(--space-2); border-radius: var(--radius-sm); }
.lab .k-cx { display: grid; gap: var(--space-4); }
.lab .k-win { display: grid; gap: var(--space-2); border: var(--line-strong) solid var(--ok); border-radius: var(--radius); background: var(--ok-soft); padding: var(--space-4); }
.lab .k-win:focus { outline: none; }
.lab .k-win p { margin: 0; }
.lab .k-win .k-win-head { font-family: var(--font-title); font-weight: var(--weight-bold); font-size: var(--text-h3); line-height: var(--leading-ui); }
.lab .k-win b { color: var(--ok); font-family: var(--font-mono); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.lab .k-win canvas { width: 100%; display: block; }
.lab .jump { font-size: var(--text-caption); }
.lab .story { font-weight: var(--weight-medium); }
@media (max-width: 520px) {
  .lab .k-lanes { gap: var(--space-2); }
  .lab .k-lane { padding: var(--space-2); }
  .lab .k-lamps { grid-template-columns: minmax(0, 1fr); }
  .act2 button.k-primary { font-size: var(--text-ui); padding: var(--space-3) var(--space-4); }
}
</style>
<template id="desk-lab">
  <div class="task" data-k="task"><p class="story">Thursday’s deploy will happen again. Change the desk, run the checker, and ship only when the bakery is paid once in every fair behavior, with two workers and still with three.</p></div>
  <div data-k="ask"></div>
  <div class="k-deploy" data-k="deploy-row">
    <button type="button" data-k="deploy" aria-pressed="false">A deploy happens</button>
    <span class="k-cap">Adds Crash: a worker holding the loan restarts and forgets it, at most once per run.</span>
  </div>
  <div class="k-changes" data-k="changes">
    <div class="k-toggles" role="group" aria-label="Changes to the desk">
      <button type="button" data-toggle="fair" aria-pressed="false">Fairness for worker steps</button>
      <button type="button" data-toggle="lease" aria-pressed="false">A lease on every claim</button>
      <button type="button" data-toggle="resume" aria-pressed="false">Workers resume their own claims</button>
      <button type="button" data-toggle="key" aria-pressed="false">Idempotency key: the loan id</button>
    </div>
    <div class="k-workers" role="group" aria-label="Workers">
      <span class="k-group-label">Workers</span>
      <button type="button" data-workers="2" aria-pressed="true">2</button>
      <button type="button" data-workers="3" aria-pressed="false">3</button>
    </div>
  </div>
  <p class="note" data-k="spec-note"></p>
  <pre class="code k-spec" data-k="spec"></pre>
  <div class="k-lanes" data-k="lanes" role="group" aria-label="Scheduler: the steps each worker may take now">
    <div class="k-lane"><span class="k-lane-name">Worker A</span><div class="row" data-lane="0"></div></div>
    <div class="k-lane"><span class="k-lane-name">Worker B</span><div class="row" data-lane="1"></div></div>
    <div class="k-forever" data-k="forever-row">
      <button type="button" data-k="forever">Nobody moves, forever</button>
    </div>
  </div>
  <div class="k-lamps" data-k="lamps">
    <div class="k-lamp" data-k="lamp-safe" data-state="wait"></div>
    <div class="k-lamp" data-k="lamp-live" data-state="wait"></div>
  </div>
  <div class="k-panel" data-k="strip-box">
    <canvas data-k="strip" class="k-strip" role="img"></canvas>
  </div>
  <p class="k-tally" data-k="tally" hidden></p>
  <div class="readout" aria-live="polite">
    <div class="result" data-k="result"></div>
    <p data-k="why"></p>
  </div>
  <div class="row">
    <button type="button" class="k-primary" data-k="run">Run the checker</button>
    <button type="button" data-k="reset">Reset</button>
  </div>
  <div class="k-cx" data-k="cx" hidden>
    <div class="k-panel" data-k="cx-safe-box">
      <p class="k-head-title" data-k="cx-safe-title"></p>
      <canvas data-k="cx-safe" class="k-strip" role="img"></canvas>
    </div>
    <div class="k-panel" data-k="cx-live-box">
      <p class="k-head-title" data-k="cx-live-title"></p>
      <canvas data-k="cx-live" class="k-strip" role="img"></canvas>
    </div>
    <p class="k-cap" data-k="cx-note"></p>
  </div>
  <div class="k-win" data-k="win" tabindex="-1" hidden>
    <p class="k-win-head" data-k="win-head">Fixed: the bakery is paid, once, through the deploy</p>
    <p>Both lamps green in every state the checker can reach: <b data-k="win-two">23</b> states with 2 workers, <b data-k="win-three">46</b> with 3.</p>
    <p data-k="win-how"></p>
    <canvas data-k="bakery" role="img" aria-label="The bank sends one transfer of €50,000 to the bakery, and loan 4471 turns from claimed to paid."></canvas>
    <p class="k-cap">Since Thursday the bakery had received €0. Now every fair behavior, crash included, ends with €50,000 sent once and the loan marked paid.</p>
  </div>
  <p class="jump" data-k="jump"><a href="#fix-the-bug">Ready to fix it? Jump to the challenge.</a></p>
</template>
<div class="lab" id="lab"></div>
