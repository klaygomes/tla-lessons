<style>

.lab button.k-primary, .act2 button.k-primary { background: var(--input); border-color: var(--input); color: var(--paper); font-weight: var(--weight-bold); }
.lab button.k-primary:hover, .act2 button.k-primary:hover { background: var(--ink); border-color: var(--ink); }
.lab button.k-primary:disabled:hover { background: var(--input); border-color: var(--input); }
.act2 { display: grid; }
.act2 button.k-primary { justify-self: start; padding: var(--space-4) var(--space-6); font-size: var(--text-h3); line-height: var(--leading-heading); text-align: left; }
.lab .k-panel { display: grid; gap: var(--space-3); }
.lab .k-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.lab .k-group-label { font-weight: var(--weight-bold); min-width: 9.5em; }
.lab .k-group button { min-height: calc(var(--space-10) + var(--space-1)); line-height: var(--leading-ui); padding: var(--space-2) var(--space-3); }
.lab .k-group .k-hint { flex-basis: 100%; color: var(--ink-soft); font-size: var(--text-small); }
.lab pre.k-spec { white-space: pre; margin: 0; }
.lab pre.k-spec .k-line { display: block; }
.lab pre.k-spec .k-line.k-changed { background: var(--input-soft); margin-inline: calc(-1 * var(--space-2)); padding-inline: var(--space-2); border-radius: var(--radius-sm); }
.lab .k-progress { font-family: var(--font-mono); font-size: var(--text-small); color: var(--ink-soft); font-variant-numeric: tabular-nums; margin: 0; }
.lab .k-trace { display: grid; gap: var(--space-3); }
.k-seq svg { display: block; max-width: 100%; height: auto; }
.k-seq text { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink-soft); }
.k-seq text.k-bad { fill: var(--accent-ink); font-weight: var(--weight-medium); }
.k-seq text.k-strong { fill: var(--ink); }
.k-seq text.k-time { font-family: var(--font-ui); fill: var(--ink); }
.k-seq .k-life { stroke: var(--rule); }
.k-seq .k-actor rect { fill: var(--paper-2); stroke: var(--ink-soft); stroke-width: 0.8; }
.k-seq .k-actor text { font-family: var(--font-ui); fill: var(--ink); }
.k-seq .k-msg { stroke: var(--ink-soft); stroke-width: 1.2; }
.k-seq .k-msg.k-bad { stroke: var(--accent); stroke-width: 1.6; }
.k-seq .k-head { fill: var(--ink-soft); }
.k-seq .k-head.k-head-bad { fill: var(--accent); }
.k-seq .k-tickline { stroke: var(--ink-soft); stroke-dasharray: 2 4; }
.k-seq .k-packet { fill: var(--paper); stroke: var(--ink-soft); stroke-width: 1; }
.k-seq .k-packet-mark { stroke: var(--ink-soft); stroke-width: 1; opacity: 0.6; }
.k-seq .k-window { fill: var(--input-soft); stroke: var(--input); stroke-width: 1; }
.k-seq .k-lost { stroke: var(--accent); stroke-width: 2; }
.k-seq .k-mask { fill: var(--paper); }

.lab .k-win:focus { outline: none; }
.lab .k-win p { margin: 0; }
.lab .k-win .k-win-head { font-family: var(--font-title); font-weight: var(--weight-bold); font-size: var(--text-h3); line-height: var(--leading-heading); }
.lab .k-win b { color: var(--ok); font-family: var(--font-mono); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.lab .k-win canvas { width: 100%; display: block; }
.lab .jump { font-size: var(--text-caption); margin: 0; }
.lab .story { font-weight: var(--weight-medium); }
@media (max-width: 520px) {
  .lab .k-lanes { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
  .lab .k-lane { padding: var(--space-2); }
  .lab .k-group-label { flex-basis: 100%; min-width: 0; }
  .act2 button.k-primary { font-size: var(--text-ui); padding: var(--space-3) var(--space-4); }

</style>
<template id="clock-lab">
  <div class="task" data-k="task"><p class="story">The bakery wants its €50,000 once, even after a weekend. Set the desk, run the checker, and ship only when both lamps stay green with the clock at 48 hours, with two workers and with three.</p></div>
  <div class="k-predict" data-k="ask"></div>
  <div class="k-panel" data-k="panel">
    <div class="k-group" role="group" aria-label="What a waiting worker does">
      <span class="k-group-label">A waiting worker</span>
      <button type="button" data-set="waiting" data-value="resend">resends on timeout</button>
      <button type="button" data-set="waiting" data-value="ask">asks the bank</button>
    </div>
    <div class="k-group" role="group" aria-label="Deadline">
      <span class="k-group-label">Deadline</span>
      <button type="button" data-set="deadline" data-value="0">off</button>
      <button type="button" data-set="deadline" data-value="1">12 h window</button>
      <button type="button" data-set="deadline" data-value="2">24 h window</button>
      <span class="k-hint">With a deadline, the bank refuses a request that arrives after it.</span>
    </div>
    <div class="k-group" role="group" aria-label="Which absent answers the worker believes">
      <span class="k-group-label">Answers</span>
      <button type="button" data-set="fresh" data-value="0">trust any “absent”</button>
      <button type="button" data-set="fresh" data-value="1">trust only answers written after the deadline</button>
    </div>
    <div class="k-group" role="group" aria-label="How long the model's clock runs">
      <span class="k-group-label">Clock runs</span>
      <button type="button" data-set="clock" data-value="1">12 h</button>
      <button type="button" data-set="clock" data-value="3">36 h</button>
      <button type="button" data-set="clock" data-value="4">48 h</button>
    </div>
    <div class="k-group" role="group" aria-label="Workers">
      <span class="k-group-label">Workers</span>
      <button type="button" data-set="workers" data-value="2">2</button>
      <button type="button" data-set="workers" data-value="3">3</button>
    </div>
  </div>
  <p class="note" data-k="spec-note">The desk’s rules right now; tinted lines differ from the desk that resends blindly. Shorthand: <code>pc′[w] = "claimed"</code> stands for <code>pc′ = [pc EXCEPT ![w] = "claimed"]</code>, and a variable a line does not mention stays unchanged.</p>
  <pre class="code k-spec" data-k="spec"></pre>
  <div class="k-lanes" data-k="lanes" role="group" aria-label="Scheduler: the steps the desk may take now">
    <div class="k-lane"><span class="k-lane-name">Worker A</span><span class="k-lane-pc" data-pc="0"></span><div class="k-acts" data-lane="0"></div></div>
    <div class="k-lane"><span class="k-lane-name">Worker B</span><span class="k-lane-pc" data-pc="1"></span><div class="k-acts" data-lane="1"></div></div>
    <div class="k-lane"><span class="k-lane-name">Clock and bank</span><span class="k-lane-pc" data-pc="clock"></span><div class="k-acts" data-lane="world"></div></div>
  </div>
  <div class="k-now" data-k="now">
    <p class="k-head-title">Friday to Sunday, 12 hours a tick</p>
    <canvas data-k="desk" class="stage" role="img"></canvas>
    <p class="k-cap">Top: the clock, with now in blue. Middle: key 4471 at the bank, from the tick it was stored; the bank keeps it 24 hours and may drop it any time after. Bottom: each transfer the bank made, at the tick it paid.</p>
  </div>
  <ol class="k-strip" data-k="strip" aria-label="Your schedule so far, step by step"></ol>
  <ul class="k-lamps" data-k="lamps" aria-live="polite"></ul>
  <p class="k-tally" data-k="tally"></p>
  <div class="readout" aria-live="polite">
    <div class="result" data-k="result"></div>
    <p data-k="why"></p>
  </div>
  <div class="row">
    <button type="button" class="k-primary" data-k="run">Run the checker</button>
    <button type="button" data-k="short" aria-pressed="false">Clock stops at Saturday 05:00</button>
    <button type="button" data-k="reset">Reset</button>
  </div>
  <p class="k-progress" data-k="progress" aria-live="polite" hidden></p>
  <div class="k-trace" data-k="trace" hidden>
    <p class="k-head-title" data-k="trace-title"></p>
    <div class="k-seq" data-k="trace-seq"></div>
    <p class="k-cap" data-k="trace-key"></p>
    <ol class="k-strip" data-k="trace-strip" aria-label="The behavior, state by state"></ol>
  </div>
  <div class="k-win" data-k="win" tabindex="-1" hidden>
    <p class="k-win-head">Fixed: the bakery is paid once, even after a weekend</p>
    <p>No reachable state pays twice or gets stuck, with the clock at 48 hours: <b data-k="win-two"></b> states with 2 workers, <b data-k="win-three"></b> with 3.</p>
    <p data-k="win-guess"></p>
    <canvas data-k="bakery" role="img" aria-label="On Monday worker A asks the bank, hears found, and the bakery keeps one transfer of €50,000."></canvas>
    <p class="k-cap">Monday, 09:12. Worker A resumes, its window long closed, so it may not resend. It asks. The bank forgot the key on Saturday but never the payment, and answers “found”. One transfer.</p>
  </div>
  <p class="jump" data-k="jump"><a href="#fix-the-bug">The fix comes at the end: jump to the challenge.</a></p>
</template>
<div class="lab" id="lab"></div>
