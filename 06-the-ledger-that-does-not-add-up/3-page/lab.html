<template id="ledger-lab">
  <div class="task" data-k="task"><p class="story">Month-end is coming. Pick a design for the payout, run the checker, and ship only when the books add up and every loan settles, with two loans and still with three.</p></div>
  <div class="k-predict" data-k="ask"></div>
  <div class="k-group" role="group" aria-label="Order of the two writes" data-k="order">
    <span class="k-group-label">Order</span>
    <button type="button" data-order="debit" aria-pressed="true">debit first</button>
    <button type="button" data-order="credit" aria-pressed="false">credit first</button>
  </div>
  <div data-k="design" class="k-panel">
    <div class="k-group" role="group" aria-label="Design">
      <span class="k-group-label">Design</span>
      <button type="button" data-design="debit" aria-pressed="true">two writes, debit first</button>
      <button type="button" data-design="credit" aria-pressed="false">two writes, credit first</button>
      <button type="button" data-design="outbox2" aria-pressed="false">outbox, separate transaction</button>
      <button type="button" data-design="outbox1" aria-pressed="false">outbox, same transaction</button>
    </div>
    <div class="k-group" role="group" aria-label="Loan ledger credit">
      <span class="k-group-label">Credit</span>
      <button type="button" data-key="off" aria-pressed="true">plain (adds the amount)</button>
      <button type="button" data-key="on" aria-pressed="false">keyed by loan id</button>
    </div>
    <div class="k-group" role="group" aria-label="Loans">
      <span class="k-group-label">Loans</span>
      <button type="button" data-loans="2" aria-pressed="true">2</button>
      <button type="button" data-loans="3" aria-pressed="false">3</button>
    </div>
  </div>
  <p class="note" data-k="spec-note">The desk’s actions right now; tinted lines changed with your last choice. Shorthand: <code>pc′[l] = "done"</code> stands for <code>pc′ = [pc EXCEPT ![l] = "done"]</code>, and a variable a line does not mention stays unchanged. One deploy per run: Crash, CrashWorker or CrashRelay, whichever the design has.</p>
  <pre class="code k-spec" data-k="spec"></pre>
  <div class="k-lanes" data-k="lanes" role="group" aria-label="Scheduler: the writes each job may make now"></div>
  <div class="k-panel" data-k="scene-wrap">
    <span class="k-head-title">The balance</span>
    <canvas data-k="scene" class="stage" role="img"></canvas>
    <p class="k-cap">Left, the pot: €200,000, dashed. Right, the treasury and each loan account, stacked. The beam is level when both sides weigh the same. A dashed block is money in no ledger; amber hatching over the stack, below the pot line, is money counted twice. Amber marks only states at rest, where no job is between its writes.</p>
  </div>
  <p class="k-lamp" data-k="lamp"><span class="k-lamp-dot" aria-hidden="true"></span><span class="k-lamp-text"></span></p>
  <p class="note" data-k="cards-note">Each card is one state of this run, named for the step that made it: Debit(4471) is loan 4471’s debit, Crash(4471) a deploy hitting its job. The lesson defines these actions further down. “At rest” means no job is between its two writes.</p>
  <ol class="k-strip" data-k="strip" aria-label="This run, state by state"></ol>
  <p class="k-tally" data-k="tally"></p>
  <p class="k-reveal" data-k="reveal" hidden>Short every time with debit first, over every time with credit first. The order picks the sign of the error, not its absence.</p>
  <div class="readout" aria-live="polite">
    <p data-k="why"></p>
  </div>
  <div class="row">
    <button type="button" class="k-primary" data-k="run">Run the checker</button>
    <button type="button" data-k="reset">Reset</button>
  </div>
  <div class="k-checker" data-k="checker" hidden>
    <p class="k-states" data-k="states" aria-live="polite"></p>
    <div class="k-lamps">
      <p class="k-lamp" data-k="lamp-safe"><span class="k-lamp-dot" aria-hidden="true"></span><span class="k-lamp-text"></span></p>
      <p class="k-lamp" data-k="lamp-live"><span class="k-lamp-dot" aria-hidden="true"></span><span class="k-lamp-text"></span></p>
    </div>
    <div class="k-trace" data-k="trace" hidden>
      <p class="k-head-title" data-k="trace-title"></p>
      <canvas data-k="escrow" class="stage" role="img"></canvas>
      <p class="k-cap">One column per state, numbered as in the cards below. Its height is the total: treasury, plus what the outbox still owes (the dashed line beside it, outbox designs only), plus every loan account. The short ticks and the dashed line mark the pot, €200,000; amber shows how far a state at rest is off.</p>
      <ol class="k-strip" data-k="trace-strip" aria-label="The shortest run that breaks the books, state by state"></ol>
    </div>
    <div class="k-trace" data-k="lasso" hidden>
      <p class="k-head-title" data-k="lasso-title"></p>
      <ol class="k-strip" data-k="lasso-strip" aria-label="A fair behavior that never settles, state by state"></ol>
    </div>
  </div>
  <div class="k-win" data-k="win" tabindex="-1" hidden>
    <p class="k-win-head">Fixed: the books add up at month-end</p>
    <p>Both lamps green: <b data-k="win-two">37</b> states with 2 loans, <b data-k="win-three">181</b> with 3. The debit and the debt commit together, the relay delivers at least once, and the key makes a second delivery change nothing.</p>
    <p data-k="win-guess"></p>
    <canvas data-k="win-scene" role="img" aria-label="Every state of a run with a relay crash and a redelivery totals €200,000."></canvas>
    <p class="k-cap">Pay 4471, Deliver, the relay crashes, Deliver again, Ack, then 4472. Every column reaches the pot: last month €50,000 was in no ledger, this month €0 is.</p>
  </div>
  <p class="jump" data-k="jump"><a href="#fix-the-bug">Ready to fix it? Jump to the challenge.</a></p>
</template>
<div class="lab" id="lab"></div>
