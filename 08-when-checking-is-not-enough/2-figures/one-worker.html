<!DOCTYPE html>

<style>

  --code-bg: var(--paper-2);
  --code-text: var(--ink);
  --code-keyword: #83339A;

  --code-number: #8C5300;

  --font-body: "Literata", Georgia, serif;

  --weight-regular: 400;

  --text-fig: 12.5px;

  --text-fig-name: 15px;
  --text-fig-note: 17px;

  --text-micro: 13px;
  --text-small: 14.5px;
  --text-caption: 15.5px;
  --text-ui: 16px;
  --text-body: 18px;
  --text-h3: 19px;
  --text-result: 19px;
  --text-lead: clamp(20px, 2.3vw, 23px);
  --text-h2: clamp(25px, 2.9vw, 29px);
  --text-h1: clamp(36px, 5.4vw, 50px);
  --text-table: 14px;
  --text-code: 14.5px;
  --text-math: 1.02em;
  --text-math-display: 1.15em;

  --leading-body: 1.62;

  --accent: #F0A73A; --accent-ink: #F4BD68; --accent-soft: #3B2C12; --input: #79A6E6; --input-soft: #233A5C; --ok: #5FC28E; --ok-soft: #15301F;
    --code-keyword: #D3A2F2; --code-string: #A3D58F; --code-number: #F4BD68; --code-function: #7CCAD3; --code-call: #A9C4F0; --code-builtin: #7CCAD3; --code-comment: #9C9C97;

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); line-height: var(--leading-body); font-optical-sizing: auto; text-rendering: optimizeLegibility; font-feature-settings: "kern", "liga"; }
::selection { background: var(--selection); color: var(--ink); }

.crumbs a { color: var(--ink-soft); }
header { display: grid; gap: var(--space-header-gap); padding-top: var(--space-header-top); }
h1 { font-size: var(--text-h1); line-height: var(--leading-title); letter-spacing: var(--tracking-title); }

.diagram { overflow-x: auto; }
section > figure, section > .lab, section > .k-wide { width: min(var(--column), calc(100vw - 2 * var(--space-gutter))); margin-left: calc((100% - min(var(--column), calc(100vw - 2 * var(--space-gutter)))) / 2); }

.lab { display: grid; gap: var(--space-4); border: var(--line-hair) solid var(--rule); border-radius: var(--radius); padding: var(--space-lab); background: var(--paper); font-family: var(--font-ui); font-size: var(--text-ui); line-height: var(--leading-ui); }

.key { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-5); font-size: var(--text-caption); color: var(--ink-soft); }

.table { overflow-x: auto; max-width: 100%; }

.myth b { color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

.toc { margin-top: var(--space-header-after); font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-ui); }

figcaption { text-wrap: pretty; }
section > figure > figcaption { width: 100%; max-width: var(--measure); margin-inline: auto; }

.k-fig { display: block; width: 100%; height: auto; --k-step: var(--motion-step); }
.k-fig.k-narrow { display: none; max-width: 440px; margin: 0 auto; }

.k-fig .k-hollow { fill: var(--paper); stroke-width: 1.5; }
.k-fig .k-stem-dot.k-hollow { stroke: var(--ink); }
.k-fig .k-bar { fill: var(--ink); }
.k-fig .k-bar-soft { fill: var(--ink-soft); }

.k-fig .k-arrow.k-accent { stroke: var(--accent); }

.k-fig .k-head { fill: var(--ink-soft); }

.k-fig .k-vec { stroke: var(--ink); stroke-width: 2; }

.k-fig .k-stop { fill: var(--ink-soft); }

.k-fig .k-mask { fill: var(--paper); }

.k-fig .k-name-ok { font-family: var(--font-ui); font-weight: var(--weight-bold); font-size: var(--text-fig-name); fill: var(--ok); }

.k-fig .k-mark-ok { stroke: var(--input); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.k-fig text { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink-soft); }
.k-fig .k-label { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink-soft); }
.k-fig .k-tick { font-family: var(--font-mono); font-size: var(--text-fig-tick); fill: var(--ink-soft); }
.k-fig .k-num { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--ink); font-variant-numeric: tabular-nums; }
.k-fig .k-num-accent { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--accent-ink); font-weight: var(--weight-medium); }
.k-fig .k-num-input { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--input); font-weight: var(--weight-medium); }
.k-fig .k-name { font-family: var(--font-ui); font-weight: var(--weight-bold); font-size: var(--text-fig-name); fill: var(--ink); }

@keyframes k-in { from { opacity: 0; } }

}
