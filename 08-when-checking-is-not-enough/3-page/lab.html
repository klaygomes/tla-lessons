<style>

.lab .k-ask button { min-width: calc(var(--space-14) + var(--space-1)); font-variant-numeric: tabular-nums; }
.lab .k-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.lab .k-group-label { font-weight: var(--weight-bold); min-width: 6.5em; }
.lab .k-group button { min-height: calc(var(--space-10) + var(--space-1)); font-family: var(--font-mono); font-size: var(--text-small); padding: var(--space-2) var(--space-3); }
.lab .k-builder, .lab .k-fix { display: grid; gap: var(--space-3); }
.lab .k-toggles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.lab .k-toggles button { display: grid; gap: var(--space-1); text-align: left; line-height: var(--leading-ui); padding: var(--space-3); }
.lab .k-toggles button small { font-family: var(--font-mono); font-size: var(--text-micro); font-weight: var(--weight-regular); color: var(--ink-soft); }
.lab pre.k-spec { white-space: pre-wrap; overflow-wrap: anywhere; }
.lab button.k-step { border-color: var(--input); color: var(--input); font-family: var(--font-mono); min-height: calc(var(--space-10) + var(--space-1)); }
.lab button.k-step:hover { background: var(--input-soft); }
.lab .k-lane-note { color: var(--ink-soft); font-size: var(--text-caption); }
.lab .k-now { display: grid; gap: var(--space-2); font-size: var(--text-ui); color: var(--ink); }
.lab .k-head-title { font-weight: var(--weight-bold); }
.lab .k-state { font-family: var(--font-mono); font-size: var(--text-small); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.lab .k-lamp { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-caption); }
.lab .k-lamp::before { content: ""; width: var(--space-3); height: var(--space-3); border-radius: 50%; border: var(--line-strong) solid var(--ink); }
.lab .k-lamp-on::before { background: var(--ink); }
.lab .k-lamp-off { color: var(--ink-soft); }
.lab .k-lamp-off::before { border-style: dashed; border-color: var(--ink-soft); }
.lab .k-cap { font-size: var(--text-small); line-height: var(--leading-caption); color: var(--ink-soft); }
.lab .k-strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-2); }
.lab .k-strip li { display: grid; padding: var(--space-1) var(--space-2); border: var(--line-hair) solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-ui); font-variant-numeric: tabular-nums; }
.lab .k-strip .k-card-step { font-family: var(--font-ui); font-weight: var(--weight-medium); color: var(--ink); }
.lab .k-strip li > span:not(.k-card-step) { color: var(--ink-soft); }
.lab .k-strip li.k-bad { border-color: var(--accent); background: var(--accent-soft); }
.lab .k-strip li.k-bad .k-card-t { color: var(--accent-ink); font-weight: var(--weight-medium); }
.lab .k-tally { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.lab .k-tally .k-bad-n { color: var(--accent-ink); font-weight: var(--weight-medium); }
.lab .readout .result { font-size: var(--text-ui); overflow-wrap: anywhere; }
.lab .k-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); font-family: var(--font-mono); font-size: var(--text-small); }
.lab .k-checks li { padding-left: var(--space-3); border-left: var(--line-mark) solid var(--rule); }
.lab .k-checks li.k-pass { border-left-color: var(--ink); }
.lab .k-checks li.k-fail { border-left-color: var(--accent); color: var(--accent-ink); }
.lab .k-checks li.k-unknown { color: var(--ink-soft); border-left-style: dashed; }
.lab .k-reach-q { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--paper-2); }
.lab .k-reach-q button.k-wrong { text-decoration: line-through; border-color: var(--rule); color: var(--ink-soft); }
.lab .k-reasons { display: grid; gap: var(--space-3); }
.lab .k-reasons .k-ask button { font-family: var(--font-ui); text-align: left; line-height: var(--leading-ui); }
.lab button.k-primary, .act2 button.k-primary { background: var(--input); border-color: var(--input); color: var(--paper); font-weight: var(--weight-bold); }
.lab button.k-primary:hover, .act2 button.k-primary:hover { background: var(--ink); border-color: var(--ink); }
.act2 { display: grid; gap: var(--space-2); }
.act2 button.k-primary { justify-self: start; padding: var(--space-4) var(--space-6); font-size: var(--text-h3); line-height: var(--leading-ui); text-align: left; }
.lab .k-win { display: grid; gap: var(--space-2); border: var(--line-strong) solid var(--ok); border-radius: var(--radius); background: var(--ok-soft); padding: var(--space-4); }
.lab .k-win:focus { outline: none; }
.lab .k-win p { margin: 0; }
.lab .k-win .k-win-head { font-family: var(--font-title); font-weight: var(--weight-bold); font-size: var(--text-h3); line-height: var(--leading-ui); }
.lab .k-win b { color: var(--ok); font-family: var(--font-mono); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.lab .k-win canvas { width: 100%; display: block; }
.lab .jump { font-size: var(--text-caption); }
.lab .story { font-weight: var(--weight-medium); }
.lab canvas.stage { cursor: pointer; }

.lab.k-act2 canvas.stage { cursor: default; }
@media (max-width: 520px) {
  .lab .k-toggles { grid-template-columns: minmax(0, 1fr); }
  .lab .k-group-label { min-width: 100%; }
  .act2 button.k-primary { font-size: var(--text-ui); padding: var(--space-3) var(--space-4); }
}
</style>
<template id="cti-lab">
  <p class="story" data-k="task" hidden>Maren asked whether anyone checked 300 workers. Build a candidate that the inductive check cannot break with two workers or with three, that the desk itself keeps, and then give the reason each step keeps it.</p>
  <div data-k="ask"></div>
  <div class="k-fix" data-k="fix" hidden>
    <div class="k-toggles" role="group" aria-label="Conjuncts to add to the candidate">
      <button type="button" data-conj="Owed" aria-pressed="false"><span>Payout budget (Owed)</span><small>transfers + claims ≤ 1</small></button>
      <button type="button" data-conj="Unclaimed" aria-pressed="false"><span>Approved means untouched (Unclaimed)</span><small>approved ⇒ 0 transfers, all idle</small></button>
      <button type="button" data-conj="OnlyOneBusy" aria-pressed="false"><span>Only one worker busy (OnlyOneBusy)</span><small>at most one pc is not idle</small></button>
    </div>
    <div class="k-group" role="group" aria-label="Workers">
      <span class="k-group-label">Workers</span>
      <button type="button" data-workers="2" aria-pressed="true">2</button>
      <button type="button" data-workers="3" aria-pressed="false">3</button>
    </div>
    <pre class="code k-spec" data-k="spec"></pre>
    <div class="row">
      <button type="button" class="k-primary" data-k="run">Run inductive check</button>
      <button type="button" data-k="run-init">Run from Init</button>
    </div>
  </div>
  <div class="k-builder" data-k="builder" role="group" aria-label="Build a state">
    <div class="k-group" role="group" aria-label="status">
      <span class="k-group-label">status</span>
      <button type="button" data-status="approved">approved</button>
      <button type="button" data-status="claimed">claimed</button>
      <button type="button" data-status="paid">paid</button>
    </div>
    <div class="k-group" role="group" aria-label="pc of A">
      <span class="k-group-label">pc of A</span>
      <button type="button" data-pa="idle">idle</button>
      <button type="button" data-pa="claimed">claimed</button>
      <button type="button" data-pa="sent">sent</button>
      <button type="button" data-pa="done">done</button>
    </div>
    <div class="k-group" role="group" aria-label="pc of B">
      <span class="k-group-label">pc of B</span>
      <button type="button" data-pb="idle">idle</button>
      <button type="button" data-pb="claimed">claimed</button>
      <button type="button" data-pb="sent">sent</button>
      <button type="button" data-pb="done">done</button>
    </div>
    <div class="k-group" role="group" aria-label="transfers">
      <span class="k-group-label">transfers</span>
      <button type="button" data-t="0">0</button>
      <button type="button" data-t="1">1</button>
    </div>
  </div>
  <p class="k-state" data-k="state"></p>
  <p data-k="lamp-row"><span data-k="lamp"></span></p>
  <div class="k-reach-q" data-k="reach-q" role="group" aria-label="Is this first state reachable?" hidden>
    <p class="k-head-title">Is this CTI’s first state reachable from Init?</p>
    <div class="row"><button type="button" data-reach="yes">Yes, the desk reaches it</button><button type="button" data-reach="no">No, the desk never reaches it</button></div>
  </div>
  <div class="k-now" data-k="now">
    <span class="k-head-title">Steps enabled in this state</span>
    <div class="row" data-k="steps" role="group" aria-label="Steps enabled in this state"></div>
  </div>
  <ol class="k-strip" data-k="pair" aria-label="The step, before and after" hidden></ol>
  <p class="k-tally" data-k="tally"></p>
  <div class="readout" aria-live="polite">
    <div class="result" data-k="result"></div>
    <p data-k="why"></p>
  </div>
  <ul class="k-checks" data-k="checks" aria-label="What a proof needs" hidden></ul>
  <div class="k-scroll" data-k="board-wrap"><canvas data-k="board" class="stage" role="img"></canvas></div>
  <p class="k-cap" data-k="board-cap">Every state with sensible values, one row per status and transfer count, one column per combination of the workers’ pcs, grouped by A (i idle, c claimed, s sent, d done). Outlined squares satisfy NoDoublePayout; the rows with 2 transfers do not. Amber squares are CTIs you have found. On narrow screens: appr approved, clmd claimed, and “A i” means A idle.</p>
  <div class="row">
    <button type="button" data-k="reach" aria-pressed="false">Show reachable</button>
    <button type="button" data-k="all" hidden>Show all CTIs</button>
  </div>
  <div class="k-reasons" data-k="reasons" hidden>
    <p class="k-head-title">The part TLC can’t give you: why each step keeps the candidate, for any number of workers.</p>
    <div class="k-reasons" data-k="reason-list"></div>
  </div>
  <div class="row"><button type="button" class="quiet" data-k="reset">Reset</button></div>
  <div class="k-win" data-k="win" tabindex="-1" hidden>
    <p class="k-win-head">Answered for Maren: no double payout, at any size</p>
    <p><b data-k="win-two">49</b> states with 2 workers, <b data-k="win-three">163</b> with 3, no CTI; your four reasons never count workers, so this holds for 300.</p>
    <canvas data-k="beam" role="img" aria-label="One step of a 300-worker desk: one worker moves from claimed to sent, its claim becomes a transfer, and transfers plus claims stays 1. The other 299 workers do not change."></canvas>
    <p class="k-cap">The reply to Maren: not “we checked three hundred”, but “every step keeps the budget, and a step only ever involves one worker”.</p>
  </div>
  <p class="jump" data-k="jump"><a href="#fix-the-bug">Ready for the fix? Jump to the challenge.</a></p>
</template>
<div class="lab" id="lab"></div>
